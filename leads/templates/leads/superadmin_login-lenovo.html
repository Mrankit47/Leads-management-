{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAdmin Login | LeadSystem</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: "#1e40af", /* blue-800 */
              secondary: "#3b82f6", /* blue-500 */
              accent: "#eff6ff", /* blue-50 */
              dark: "#0f172a", /* slate-900 */
            },
            animation: {
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" },
              }
            }
          },
        },
      };
    </script>
    <style>
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
    </style>
</head>
<body class="font-sans text-gray-800 bg-gradient-to-br from-white via-accent to-blue-100 min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-blue-200 selection:text-blue-900">

    <!-- Abstract background shapes -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000 translate-x-1/2 translate-y-1/2 pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 px-4">
        
        <!-- Logo / Title -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center text-white font-bold text-3xl mx-auto shadow-lg shadow-blue-500/30 mb-4">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-dark tracking-tight">SuperAdmin</h1>
            <p class="text-gray-500 font-medium mt-1">Platform Management Login</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card shadow-xl rounded-2xl p-8 transform transition-all duration-300 hover:shadow-2xl">
            
            <form method="POST" action="{% url 'superadmin_login' %}">
                {% csrf_token %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-r shadow-sm text-sm font-medium flex items-center">
                            <i class="fa-solid fa-circle-exclamation mr-3 text-lg"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="mb-5 relative group">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary transition-colors">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <input
                            type="text"
                            name="username"
                            required
                            placeholder="Enter superadmin username"
                            class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 text-gray-800 placeholder-gray-400 shadow-sm font-medium"
                        />
                    </div>
                </div>

                <div class="mb-8 relative group">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary transition-colors">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input
                            type="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 text-gray-800 placeholder-gray-400 shadow-sm font-medium"
                        />
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full bg-primary text-white font-bold py-3.5 px-4 rounded-xl hover:bg-blue-900 shadow-lg shadow-blue-500/30 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 flex justify-center items-center"
                >
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Authorize Access
                </button>
            </form>
        </div>

        <!-- Links -->
        <div class="text-center mt-8 space-y-3">
            <a href="{% url 'login' %}" class="inline-flex items-center text-sm font-semibold text-gray-500 hover:text-primary transition-colors hover:underline decoration-2 underline-offset-4">
                <i class="fa-solid fa-users mr-2"></i> Back to Employee Login
            </a>
            <div class="block">
                <a href="{% url 'home' %}" class="inline-flex items-center text-sm font-semibold text-gray-400 hover:text-gray-700 transition-colors">
                    <i class="fa-solid fa-house mr-2"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>
</body>
</html>
