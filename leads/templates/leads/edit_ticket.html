{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Ticket #{{ ticket.id }} | LeadGen Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-white via-blue-50 to-blue-100 min-h-screen py-12 px-4 sm:px-6 lg:px-8">

    <!-- Navigation -->
    <div class="max-w-3xl mx-auto mb-8 text-center sm:text-left">
        <a href="{% url 'ticket_detail' ticket.id %}" 
           class="inline-flex items-center text-sm font-bold text-blue-600 hover:text-blue-800 transition-all group">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-3 group-hover:-translate-x-1 transition-transform">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </div>
            Back to Ticket Detail
        </a>
    </div>

    <!-- Centered Card Container -->
    <div class="max-w-3xl mx-auto glass-card rounded-3xl shadow-2xl shadow-blue-900/10 overflow-hidden border-0">
        <div class="bg-blue-800 px-10 py-10 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-400/20 rounded-full -mr-16 -mt-16 blur-2xl"></div>
            <div class="relative z-10 text-center sm:text-left">
                <h2 class="text-3xl font-black text-white tracking-tight flex items-center justify-center sm:justify-start gap-3">
                    <i class="fa-solid fa-pen-to-square text-blue-300"></i> Update Ticket #{{ ticket.id }}
                </h2>
                <p class="mt-2 text-blue-100 font-medium opacity-80">Refine ticket details and track progress.</p>
            </div>
        </div>

        <form method="POST" class="p-10 space-y-8 bg-white/50">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6 text-left">
                <!-- Subject -->
                <div class="md:col-span-2 space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Subject</label>
                    <div class="relative">
                        <i class="fa-solid fa-heading absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="text" name="subject" value="{{ ticket.subject }}" required placeholder="Brief summary of the issue"
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>

                <!-- Status -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Current Status</label>
                    <div class="relative">
                        <i class="fa-solid fa-spinner absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <select name="status"
                                class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium cursor-pointer appearance-none">
                            {% for s_val, s_name in status_choices %}
                            <option value="{{ s_val }}" {% if ticket.status == s_val %}selected{% endif %}>{{ s_name }}</option>
                            {% endfor %}
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 text-[10px] pointer-events-none"></i>
                    </div>
                </div>

                <!-- Priority -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Priority Level</label>
                    <div class="relative">
                        <i class="fa-solid fa-bolt absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <select name="priority"
                                class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium cursor-pointer appearance-none">
                            {% for p_val, p_name in priority_choices %}
                            <option value="{{ p_val }}" {% if ticket.priority == p_val %}selected{% endif %}>{{ p_name }}</option>
                            {% endfor %}
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 text-[10px] pointer-events-none"></i>
                    </div>
                </div>

                <!-- Department -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Target Department</label>
                    <div class="relative">
                        <i class="fa-solid fa-building-flag absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="text" name="department" value="{{ ticket.department }}" placeholder="e.g. Sales, IT Support"
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>

                <!-- Assign To -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Assign Responsible Agent</label>
                    <div class="relative">
                        <i class="fa-solid fa-user-tie absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <select name="assigned_to"
                                class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium cursor-pointer appearance-none">
                            <option value="">Auto-Assign (Select Agent)</option>
                            {% for u in users %}
                            <option value="{{ u.id }}" {% if ticket.assigned_to.id == u.id %}selected{% endif %}>{{ u.username }}</option>
                            {% endfor %}
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 text-[10px] pointer-events-none"></i>
                    </div>
                </div>

                <!-- Project -->
                <div class="md:col-span-2 space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Linked Project</label>
                    <div class="relative">
                        <i class="fa-solid fa-diagram-project absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="text" name="project" value="{{ ticket.project }}" placeholder="Related project name"
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>

                <!-- Description -->
                <div class="md:col-span-2 space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Comprehensive Description</label>
                    <div class="relative">
                        <i class="fa-solid fa-comment-dots absolute left-4 top-6 text-gray-300 text-xs"></i>
                        <textarea name="description" rows="5" required placeholder="Describe the inquiry or issue in detail..."
                                  class="w-full pl-10 pr-4 py-4 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium resize-none">{{ ticket.description }}</textarea>
                    </div>
                </div>
            </div>

            <div class="pt-8 flex flex-col sm:flex-row gap-4">
                <button type="submit" class="flex-1 bg-blue-800 hover:bg-blue-900 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-800/10 transition transform active:scale-[0.98] flex items-center justify-center gap-3">
                    <i class="fa-solid fa-save"></i>
                    Save Changes
                </button>
                <a href="{% url 'ticket_detail' ticket.id %}" 
                   class="flex-1 bg-white hover:bg-gray-50 text-gray-500 font-bold py-4 rounded-2xl text-center border border-gray-200 transition-all shadow-sm">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</body>
</html>
