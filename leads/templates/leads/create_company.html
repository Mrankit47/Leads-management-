{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Company | SuperAdmin</title>
    
    <!-- Theme Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 50%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 40px rgba(30, 64, 175, 0.08);
        }

        .field-input {
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.6);
        }
        
        .field-input:focus {
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            border-color: #3b82f6;
        }

        .primary-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }
        
        .primary-gradient:hover {
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }
    </style>
</head>

<body class="font-sans">

    <!-- Back Navigation -->
    <div class="fixed top-8 left-8 z-50">
        <a href="{% url 'superadmin_dashboard' %}" 
           class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white/50 backdrop-blur-md border border-white/50 text-sm font-bold text-slate-600 hover:text-blue-600 hover:bg-white transition-all group shadow-sm">
            <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"></i>
            Return to Dashboard
        </a>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md">
        
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-xl mb-4">
                <i class="fa-solid fa-building-circle-plus text-2xl text-blue-600"></i>
            </div>
            <h2 class="text-3xl font-outfit font-black text-slate-900 tracking-tight">Deploy New Entity</h2>
            <p class="text-slate-500 font-medium text-sm mt-1">Configure a new corporate tenant node.</p>
        </div>

        <!-- Create Company Form Card -->
        <div class="glass-card p-10 rounded-3xl relative overflow-hidden">
            <!-- Decorative Accent -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>
            
            {% if messages %}
                <div class="space-y-3 mb-6">
                {% for message in messages %}
                    <div class="p-4 rounded-xl bg-rose-50 border border-rose-100 text-rose-600 text-sm font-bold flex items-center gap-3 animate-shake">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 ml-1">Company Detail</label>
                    <div class="relative">
                        <i class="fa-solid fa-building absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" name="company_name" placeholder="Business Name" 
                               class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 field-input outline-none text-slate-700 font-semibold placeholder:text-slate-300" required>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 ml-1">Admin Credentials</label>
                    
                    <div class="space-y-4">
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="text" name="admin_username" placeholder="Username" 
                                   class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 field-input outline-none text-slate-700 font-semibold placeholder:text-slate-300" required>
                        </div>

                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="email" name="admin_email" placeholder="Email Address" 
                                   class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 field-input outline-none text-slate-700 font-semibold placeholder:text-slate-300" required>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="password" name="password" placeholder="Passphrase" 
                               class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 field-input outline-none text-slate-700 font-semibold placeholder:text-slate-300" required>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-shield-halved absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="password" name="confirm_password" placeholder="Verify" 
                               class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 field-input outline-none text-slate-700 font-semibold placeholder:text-slate-300" required>
                    </div>
                </div>

                <button type="submit" class="w-full primary-gradient text-white py-4 rounded-2xl font-black font-outfit text-sm uppercase tracking-widest transition-all mt-6 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-rocket text-xs"></i>
                    Initialize Deployment
                </button>
            </form>
        </div>

        <p class="text-center text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mt-8">
            Network Operations Center &copy; 2026
        </p>
    </div>

</body>
</html>
