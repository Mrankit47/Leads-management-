{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New User | LeadGen Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-white via-blue-50 to-blue-100 min-h-screen py-12 px-4 sm:px-6 lg:px-8">

    <!-- Navigation -->
    <div class="max-w-3xl mx-auto mb-8">
        <a href="{% if user.userprofile.role == 'admin' %}{% url 'company_admin_dashboard' %}{% elif user.userprofile.role == 'manager' %}{% url 'manager_dashboard' %}{% elif user.userprofile.role == 'editor' or user.userprofile.role == 'employee' or user.userprofile.role == 'hybrid' %}{% url 'employee_dashboard' %}{% else %}{% url 'dashboard' %}{% endif %}" 
           class="inline-flex items-center text-sm font-bold text-blue-600 hover:text-blue-800 transition-all group">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-3 group-hover:-translate-x-1 transition-transform">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </div>
            Back to Dashboard
        </a>
    </div>

    <!-- Centered Card Container -->
    <div class="max-w-3xl mx-auto glass-card rounded-3xl shadow-2xl shadow-blue-900/10 overflow-hidden border-0">
        <div class="bg-blue-800 px-10 py-10 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-400/20 rounded-full -mr-16 -mt-16 blur-2xl"></div>
            <div class="relative z-10">
                <h2 class="text-3xl font-black text-white tracking-tight flex items-center gap-3">
                    <i class="fa-solid fa-user-plus text-blue-300"></i> Add Staff Member
                </h2>
                <p class="mt-2 text-blue-100 font-medium opacity-80">Configure access and roles for your team members.</p>
            </div>
        </div>

        <form method="POST" class="p-10 space-y-8 bg-white/50">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                <!-- First Name -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">First Name</label>
                    <div class="relative">
                        <i class="fa-solid fa-signature absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="text" name="first_name" placeholder="Enter first name" required
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>

                <!-- Last Name -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Last Name</label>
                    <div class="relative">
                        <i class="fa-solid fa-signature absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="text" name="last_name" placeholder="Enter last name" required
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>

                <!-- Username -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="text" name="username" placeholder="Enter username" required
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>

                <!-- Email -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="email" name="email" placeholder="name@company.com" required
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>

                <!-- Contact -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Contact Number</label>
                    <div class="relative">
                        <i class="fa-solid fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="text" name="contact" placeholder="Optional phone number"
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>

                <!-- Department -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Department</label>
                    <div class="relative">
                        <i class="fa-solid fa-building-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <select name="department" class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium cursor-pointer appearance-none">
                            <option value="sales">Sales</option>
                            <option value="marketing">Marketing</option>
                            <option value="support">Support</option>
                            <option value="operations">Operations</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 text-[10px] pointer-events-none"></i>
                    </div>
                </div>

                <!-- Role -->
                <div class="md:col-span-2 space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Assigned Role</label>
                    <div class="relative">
                        <i class="fa-solid fa-shield-halved absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <select name="role" class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium cursor-pointer appearance-none">
                            {% if user.userprofile.role == 'admin' %}
                            <option value="manager">Manager</option>
                            <option value="admin">Admin (Co-Admin)</option>
                            {% endif %}
                            <option value="editor">Editor</option>
                            <option value="employee">Employee</option>
                            <option value="hybrid">Hybrid</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 text-[10px] pointer-events-none"></i>
                    </div>
                    {% if user.userprofile.role == 'manager' %}
                    <div class="mt-3 flex items-start gap-2 bg-blue-50 border border-blue-100 p-3 rounded-xl">
                        <i class="fa-solid fa-circle-info text-blue-600 text-xs mt-0.5"></i>
                        <p class="text-[11px] text-blue-700 font-bold leading-relaxed">
                            Manager Note: You can authorize Editor, Employee, or Hybrid permissions.
                        </p>
                    </div>
                    {% endif %}
                </div>

                <!-- Password -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="password" name="password" placeholder="••••••••" required
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Confirm Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock-open absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                        <input type="password" name="confirm_password" placeholder="••••••••" required
                               class="w-full pl-10 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl focus:border-blue-600 focus:ring-4 focus:ring-blue-100 outline-none transition-all duration-200 font-medium">
                    </div>
                </div>
            </div>

            <div class="pt-8 flex flex-col sm:flex-row gap-4">
                <button type="submit" class="flex-1 bg-blue-800 hover:bg-blue-900 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-800/10 transition transform active:scale-[0.98] flex items-center justify-center gap-3">
                    <i class="fa-solid fa-circle-check"></i>
                    Create User Account
                </button>
                <a href="{% if user.userprofile.role == 'admin' %}{% url 'company_admin_dashboard' %}{% elif user.userprofile.role == 'manager' %}{% url 'manager_dashboard' %}{% elif user.userprofile.role == 'editor' or user.userprofile.role == 'employee' or user.userprofile.role == 'hybrid' %}{% url 'employee_dashboard' %}{% else %}{% url 'dashboard' %}{% endif %}" 
                   class="flex-1 bg-white hover:bg-gray-50 text-gray-500 font-bold py-4 rounded-2xl text-center border border-gray-200 transition-all shadow-sm">
                    Discard
                </a>
            </div>
        </form>
    </div>
</body>
</html>
