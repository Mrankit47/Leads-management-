<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #450a0a 0%, #7f1d1d 100%);
            color: #fee2e2;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 600px;
        }
        h1 {
            font-size: 8rem;
            margin: 0;
            background: linear-gradient(to right, #fca5a5, #fecaca);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            color: #fecaca;
            opacity: 0.8;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: #f87171;
            color: #450a0a;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            background: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>System Failure</h2>
        <p>Something went wrong on our end. Our engineers have been notified and are working to fix it. Please try again later.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
